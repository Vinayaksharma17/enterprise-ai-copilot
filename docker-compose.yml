services:
  mongodb:
    image: mongo:7.0
    container_name: enterprise-ai-copilot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-enterprise-ai-copilot}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - enterprise-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: enterprise-ai-copilot-chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    container_name: enterprise-ai-copilot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local model runtime for chat generation and embeddings.
  # Models are NOT downloaded on startup; pull them manually (see README):
  #   docker exec -it enterprise-ai-copilot-ollama ollama pull qwen2.5:3b
  #   docker exec -it enterprise-ai-copilot-ollama ollama pull nomic-embed-text
  # They persist in the ollama_data volume across container recreation.
  ollama:
    image: ollama/ollama:0.5.7
    container_name: enterprise-ai-copilot-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - enterprise-network
    # Ollama is reachable by the backend at http://ollama:11434 over the
    # internal network only. Uncomment to expose the port for local diagnostics
    # (bound to loopback so it is never reachable from untrusted networks).
    # ports:
    #   - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: enterprise-ai-copilot-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      # Only wait for the container to start; the backend retries transient
      # Ollama unavailability so it does not fail permanently while models are
      # still loading or being pulled.
      ollama:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/enterprise-ai-copilot?authSource=admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-enterprise-ai-copilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CHROMA_URL: ${CHROMA_URL:-http://chromadb:8000}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-documents}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-super-secret-jwt-access-key-change-this-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_DEPARTMENT: ${ADMIN_DEPARTMENT:-Admin}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000/api/v1}
      # Document ingestion
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      # RAG
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0}
      # LLM / embeddings provider
      # Defaults select local Ollama inference. Set LLM_PROVIDER/EMBEDDING_PROVIDER
      # to "openai" (and provide keys) to use a cloud provider instead.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      # Ollama runtime
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-16}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - enterprise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: enterprise-ai-copilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - enterprise-network

volumes:
  mongodb_data:
  chromadb_data:
  redis_data:
  uploads_data:
  ollama_data:

networks:
  enterprise-network:
    driver: bridge
